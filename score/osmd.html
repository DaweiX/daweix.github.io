<style type="text/css">
.at-wrap {
  width: 100%;
  min-height: 500px;
  position: relative;
}

/* 播放器面板样式 */
.player-panel {
  position: fixed;
  bottom: 12px;
  right: 64px;
  width: 380px;
  height: 32px;
  background: color-mix(in srgb, var(--text-color) 60%, transparent);
  border: none;
  border-radius: 0;
  z-index: 9998;
  display: flex;
  align-items: center;
  padding: 0 10px;
  transition: transform 0.3s ease, visibility 0.3s ease;
  transform: translateX(100%);
  visibility: hidden;
}

/* 面板展开状态 */
.player-panel.active {
  transform: translateX(0);
  visibility: visible;
}

/* 面板内的按钮容器 */
.panel-controls {
  display: flex;
  align-items: center;
  width: 100%;
  justify-content: space-between;
  gap: 8px;
  z-index: 9999;
  background: transparent;
}

/* 播放器控制按钮通用样式 (循环、播放/暂停、停止) */
.player-control-btn {
  background: none;
  border: none;
  cursor: pointer;
  width: 32px;
  height: 32px;
  padding: 0;
  border-radius: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0; /* 防止按钮被进度条挤压 */
}
.player-control-btn:hover {
  background: rgba(0,0,0,0.1);
}
/* 按钮点击后的强调状态 */
.player-control-btn.active {
  background: var(--link-hover-color);
}

/* 进度条样式 */
.progress-bar {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  overflow: hidden;
  width: 64px;
  background-color: var(--link-hover-color);
}
/* 时间显示样式 */
.time-display {
  font-size: 10px;
  white-space: nowrap;
  flex-shrink: 0;
  color: var(--link-hover-color);
  filter: invert(1);
}

/* 右侧 Pin 按钮 */
.pin-btn {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
}
/* Pin 按钮选中状态 */
.pin-btn.active {
  background: var(--link-hover-color);
}

/* 切换按钮样式 */
.toggle-player-btn {
  position: fixed;
  bottom: 12px;
  right: 32px;
  width: 32px;
  height: 32px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 0;
  cursor: pointer;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}
.toggle-player-btn:hover {
  background: #45a049;
}

.at-cursor-bar {
  /* Defines the color of the bar background when a bar is played */
  background: color-mix(in srgb, var(--text-color) 10%, transparent);
}

.at-selection div {
  /* Defines the color of the selection background */
  background: background: color-mix(in srgb, var(--link-hover-color) 10%, transparent);
}

.at-cursor-beat {
  /* Defines the beat cursor */
  background: rgba(69, 160, 73, 0.3);
  width: 3px;
}

.at-highlight * {
  /* Defines the color of the music symbols when they are being played (svg) */
  fill: var(--link-hover-color);
  stroke: var(--link-hover-color);
}
.ctrl-icn {
  width: 16px;
  height: 16px;
  fill: var(--link-hover-color);
  filter: invert(1);
}
#staveToggleBtn {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 7px 0 7px 0;
  font-size: 10px;
  color: var(--link-hover-color);
  filter: invert(1);
}
#staveToggleBtn::before {
  content: "";
  width: 50%;
  background-color: var(--link-hover-color);
  height: 1.3px;
}
#staveToggleBtn::after {
  content: "";
  width: 50%;
  background-color: var(--link-hover-color);
  height: 1.3px;
}
g {
  fill: var(--link-hover-color);
}
path {
  fill: var(--link-hover-color);
}
.at-surface-svg rect[width^="1."] {
  fill: var(--link-hover-color);
}
text {
  fill: var(--link-hover-color);
}
</style>

      titleElement.innerHTML = f.split(".")[0];
    }

    const wrapper = document.querySelector(".at-wrap");
    const main = wrapper.querySelector(".at-main");
    const settings = new alphaTab.Settings();
    settings.core.engine = "svg";
    settings.display.staveProfile = alphaTab.StaveProfile.ScoreTab; 
    settings.display.scale = 1.0; 
    settings.display.firstStaffPaddingLeft = 2;
    settings.display.padding = [8, 8];
    // let hex = getComputedStyle(document.documentElement).getPropertyValue('--link-hover-color').trim().replace('#', '');
    // if (hex.length === 3) {
    //   hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
    // }
    // console.log(hex);
    // let colorStr = "#00FF00";
    // let c = alphaTab.model.Color.fromJson(parseInt(hex, 16) | 0xFF000000); // no alpha
    // console.log(c);
    // settings.display.resources.barSeparatorColor = c;
    // settings.display.resources.mainGlyphColor = c;
    // settings.display.resources.staffLineColor = c;
    settings.notation.elements.set(alphaTab.NotationElement.ScoreTitle, false);
    settings.notation.elements.set(alphaTab.NotationElement.ScoreSubTitle, false);
    settings.notation.elements.set(alphaTab.NotationElement.TrackNames, false);
    settings.notation.elements.set(alphaTab.NotationElement.ChordDiagrams, false);
    settings.notation.elements.set(alphaTab.NotationElement.ScoreArtist, false);
    settings.notation.elements.set(alphaTab.NotationElement.ScoreAlbum, false);
    // settings.notation.elements.set(alphaTab.NotationElement.ScoreWordsAndMusic, false);
    settings.notation.elements.set(alphaTab.NotationElement.ScoreCopyright, false);
    settings.notation.elements.EffectFingering = true;
    settings.notation.fingeringMode = alphaTab.FingeringMode.ScoreDefault;
    settings.notation.notationMode = alphaTab.NotationMode.GuitarPro;
    // player
    settings.player.enablePlayer = true;
    settings.player.soundFont = 'https://unpkg.com/@coderline/alphatab@latest/dist/soundfont/sonivox.sf2';
    settings.player.scrollElement = document.body;
    
    const api = new alphaTab.AlphaTabApi(main, settings);
    api.load("./xml/" + f);
    
    const overlay = wrapper.querySelector(".at-overlay");
    const staveToggleBtn = document.getElementById('staveToggleBtn');
    let hasScore = false;
    let hasTab = false;
    let currentStaveProfile = alphaTab.StaveProfile.ScoreTab;

    api.scoreLoaded.on(score => {
      if (score && score.tracks && score.tracks.length > 0) {
        const track = score.tracks[0];
        if (track.staves) {
          hasScore = track.staves.some(s => s.showStandardNotation !== false);
          hasTab = track.staves.some(s => s.showTablature !== false);
        }
      }
      if (!hasScore && hasTab) {
        currentStaveProfile = alphaTab.StaveProfile.Tab;
        staveToggleBtn.style.cursor = 'not-allowed';
        staveToggleBtn.disabled = true;
      } else if (hasScore && !hasTab) {
        currentStaveProfile = alphaTab.StaveProfile.Score;
        staveToggleBtn.style.cursor = 'not-allowed';
        staveToggleBtn.disabled = true;
      }
      api.settings.display.staveProfile = currentStaveProfile;
      api.render();
      updateStaveToggleBtnTitle();
    });

    api.renderStarted.on(() => {
        overlay.style.display = 'flex';
    });
    api.renderFinished.on(() => {
        overlay.style.display = 'none';
        console.log('Rendering finished');
    });
    api.error.on((e) => {
        console.error(e);
    });

    function updateStaveToggleBtnTitle() {
      let title = '';
      let inner = '';
      switch (currentStaveProfile) {
        case alphaTab.StaveProfile.ScoreTab:
          inner = '5|6';
          title = "Both Score & Tab";
          break;
        case alphaTab.StaveProfile.Score:
          inner = '5';
          title = "Score";
          break;
        case alphaTab.StaveProfile.Tab:
          inner = '6';
          title = "Tab";
          break;
        default:
          inner = '5|6';
          title = "Both Score & Tab";
          break;
      }
      staveToggleBtn.innerHTML = inner;
      staveToggleBtn.title = title;
    }

    // --- 播放器面板交互逻辑 ---
    const toggleBtn = document.getElementById('togglePlayerBtn');
    const playerPanel = document.getElementById('playerPanel');
    const pinBtn = document.getElementById('pinBtn');
    let isPinned = false; // 记录 Pin 状态

    // 1. 切换面板显示/隐藏
    toggleBtn.addEventListener('click', function(e) {
        e.stopPropagation(); // 防止触发 document 的点击事件
        playerPanel.classList.toggle('active');
    });

    // 2. Pin 按钮点击逻辑
    pinBtn.addEventListener('click', function(e) {
        e.stopPropagation(); // 防止触发 document 的点击事件
        isPinned = !isPinned;
        if (isPinned) {
            pinBtn.classList.add('active');
        } else {
            pinBtn.classList.remove('active');
        }
    });

    // 3. 点击面板外部自动收起逻辑
    document.addEventListener('click', function(e) {
        // 如果面板处于展开状态，且没有被 Pin 住
        if (playerPanel.classList.contains('active') && !isPinned) {
            // 如果点击的目标不在面板内部，也不在触发按钮上
            if (!playerPanel.contains(e.target) && !toggleBtn.contains(e.target)) {
                playerPanel.classList.remove('active');
            }
        }
    });

    function formatDuration(milliseconds) {
      let seconds = milliseconds / 1000;
      const minutes = (seconds / 60) | 0;
      seconds = (seconds - minutes * 60) | 0;
      return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0")
      );
    }

    // --- 播放器控制按钮逻辑 ---
    const loopBtn = document.getElementById('loopBtn');
    const countBtn = document.getElementById('countBtn');
    const metroBtn = document.getElementById('metroBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progressBar = document.getElementById('progressBar');
    const songPosition = document.getElementById('songPosition');

    // stave toggle btn
    staveToggleBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (staveToggleBtn.disabled) return;

        const profiles = [];
        if (hasScore && hasTab) {
          profiles.push(alphaTab.StaveProfile.ScoreTab);
          profiles.push(alphaTab.StaveProfile.Score);
          profiles.push(alphaTab.StaveProfile.Tab);
        } else if (hasScore) {
          profiles.push(alphaTab.StaveProfile.Score);
        } else if (hasTab) {
          profiles.push(alphaTab.StaveProfile.Tab);
        }

        const currentIndex = profiles.indexOf(currentStaveProfile);
        const nextIndex = (currentIndex + 1) % profiles.length;
        currentStaveProfile = profiles[nextIndex];
        console.log(currentStaveProfile);
        api.settings.display.staveProfile = currentStaveProfile;
        api.updateSettings();
        api.render();
        updateStaveToggleBtnTitle();
    });

    // count btn
    countBtn.addEventListener('click', function(e) {
        this.classList.toggle('active');
        if (this.classList.contains('active')) {
            api.countInVolume = 1;
        } else {
            api.countInVolume = 0;
        }
    });

    // metro btn
    metroBtn.addEventListener('click', function(e) {
        this.classList.toggle('active');
        if (this.classList.contains('active')) {
            api.metronomeVolume = 1;
        } else {
            api.metronomeVolume = 0;
        }
    });

    // 循环按钮点击
    loopBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        this.classList.toggle('active');
        api.isLooping = this.classList.contains('active');
    });

    // 播放/暂停按钮点击
    playPauseBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        api.playPause(); 
        const isPlaying = playIcon.style.display !== 'none'; 
        if (isPlaying) {
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
        } else {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
        }
    });

    // 停止按钮点击
    stopBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        api.stop();
        // 重置图标为播放状态
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        // 重置进度条
        progressBar.value = 0;
    });
    let previousTime = -1;
    api.playerPositionChanged.on((e) => {
      // reduce number of UI updates to second changes.
      const currentSeconds = (e.currentTime / 1000) | 0;
      if (currentSeconds == previousTime) {
        return;
      }
      songPosition.innerText =
        formatDuration(e.currentTime) + " / " + formatDuration(e.endTime);
        if (e.currentTime == 0) {
          progressBar.value = 0;
        } else {
          progressBar.value = Math.ceil((e.currentTime / e.endTime) * 100);
        }
    });
    api.playerReady.on(() => {
        progressBar.value = 0;
    });
});
</script>
